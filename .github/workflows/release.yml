name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.16"  # same runtime as the 1.0.0 build, so packaged output stays comparable
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check version matches the tag
        run: |
          $version = (python -c "import lolhex; print(lolhex.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match __version__ $version" }

      - name: Refresh bundled statistics
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # Take the newest statistics; if that fails, keep the bundled data already committed.
          try { python scripts/update_data.py } catch { Write-Warning "could not fetch latest data, using the committed bundle: $_" }
          if ($LASTEXITCODE) { Write-Warning "could not fetch latest data, using the committed bundle"; $global:LASTEXITCODE = 0 }

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        run: pwsh -NoProfile -File packaging/build.ps1 -PythonExe python

      - name: Generate release notes
        run: python scripts/release_notes.py "${{ github.ref_name }}" > build/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build/release | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --title "AramHex ${{ github.ref_name }}" --notes-file build/release-notes.md
