name: 发布

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.16"  # 和 1.0.0 一样，打包后的运行环境保持一致
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements-build.txt

      - name: 核对版本号
        run: |
          $version = (python -c "import lolhex; print(lolhex.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} 和 __version__ $version 不一致" }

      - name: 更新内置统计数据
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # 取最新的统计数据；取不到就用仓库里已提交的内置数据
          try { python scripts/update_data.py } catch { Write-Warning "取不到最新数据，用已提交的内置数据：$_" }
          if ($LASTEXITCODE) { Write-Warning "取不到最新数据，用已提交的内置数据"; $global:LASTEXITCODE = 0 }

      - name: 测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 打包
        run: pwsh -NoProfile -File packaging/build.ps1 -PythonExe python

      - name: 发布说明
        run: python scripts/release_notes.py "${{ github.ref_name }}" > build/release-notes.md

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build/release | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --title "海克斯大乱斗助手 ${{ github.ref_name }}" --notes-file build/release-notes.md
